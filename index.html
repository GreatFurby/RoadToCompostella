<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Road to Compostella</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
:root{font:16px system-ui,sans-serif;color:#25382f;background:#f7f3e9}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(12px,4vw,30px);background:#fbf8ef;border-bottom:1px solid #dfded0}
h1{font:700 clamp(1.3rem,4vw,1.9rem) Georgia,serif;margin:0}
nav,.actions{display:flex;flex-wrap:wrap;gap:8px}
main{max-width:1220px;margin:auto;padding:12px}
button,a.button,input{font:inherit}
button,a.button{min-height:42px;padding:8px 12px;border:1px solid #bdc8bc;border-radius:8px;background:#fff;color:#21392d;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button.primary{color:#fff;background:#245b41;border-color:#245b41;font-weight:600}
button:disabled{opacity:.55;cursor:default}
#map{height:clamp(290px,calc(100dvh - 220px),830px);background:#e8ebe2;border-radius:10px;border:1px solid #cad2c7;margin:8px 0}
#summary{margin:0;font-weight:650}
#notice{min-height:1.3em;margin:8px 0}
#account,#entry{max-width:410px;margin:12px auto;padding:16px;background:#fff;border:1px solid #dddcd0;border-radius:10px}
h2{margin:0 0 12px;font:700 1.4rem Georgia,serif}
form{display:grid;gap:10px}
label{display:grid;gap:4px}
input{width:100%;padding:10px;border:1px solid #aebbb0;border-radius:6px}
.player-icon{background:transparent;border:0;pointer-events:none}
.meeple{display:grid;justify-items:center;position:absolute;bottom:0;left:50%;width:max-content;transform:translateX(calc(-50% + var(--offset)));gap:2px}
.meeple-name{background:#fff;color:#26352c;border-radius:9px;padding:1px 6px;box-shadow:0 1px 3px #0004;font-size:11px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.meeple-body{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:var(--player);border:2px solid #fff;box-shadow:0 1px 4px #0005;font-size:17px}
.meeple.you .meeple-name{background:#214c38;color:white}
.walker-group{display:grid;place-items:center;border-radius:14px;background:#214c38;color:#fff;font-weight:700;box-shadow:0 1px 4px #0005;white-space:nowrap}
.next-icon{border:2px solid #664f16;background:#ffda61;border-radius:50%;box-shadow:0 0 0 3px #ffecacaa}
.next-icon.locked{background:#e6e3d9;box-shadow:none;border-color:#79796a;cursor:default}
@media(max-width:500px){header{gap:6px}nav{gap:4px}nav button{padding-inline:8px}main{padding:8px}#map{height:clamp(270px,calc(100dvh - 240px),680px)}}
</style>
</head>
<body>
<header><h1>Road to Compostella</h1><nav aria-label="Game"><button id="map-tab" type="button" hidden>Map</button><button id="account-tab" type="button" hidden>Account</button></nav></header>
<main>
<p id="notice" role="status"></p>
<section id="account">
  <h2>Account</h2>
  <form id="login">
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
  <div id="signed-in" hidden><p id="identity"></p><button id="logout" type="button">Sign out</button></div>
</section>
<section id="game" hidden aria-label="Pilgrimage map">
  <p id="summary"></p>
  <div id="map"></div>
  <div class="actions">
    <button class="primary" id="sync" type="button">Sync</button>
    <button id="manual" type="button" hidden>Enter steps</button>
    <button id="move" type="button">Move one node</button>
    <a class="button" id="street" target="_blank" rel="noopener">Street View</a>
    <button id="center" type="button" hidden>Back to me</button>
  </div>
  <section id="entry" hidden>
    <h2>Enter steps</h2>
    <form id="steps">
      <label>Date<input name="date" type="date" required></label>
      <label>Total steps for that day<input name="steps" type="number" min="0" max="100000" step="1" required></label>
      <button class="primary">Save steps</button>
    </form>
  </section>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>

<script>
'use strict';
const $ = id => document.getElementById(id);
const sessionKey = 'rtc-browser-session';
let token = '';
try { token = sessionStorage.getItem(sessionKey) || ''; } catch {}
let state = null;
let busy = false;
let needsSync = false;
const localZoom = 16;
const namedZoom = localZoom;
let map, route, meters, nodes, walked, ahead, playerMarkers, nextMarker;
const colours = ['#226a48','#5745a0','#a24355','#286b99','#985a26','#677823'];

function readRoute() {
  const bytes = Uint8Array.from(atob($('route-data').textContent.trim()), char => char.charCodeAt(0));
  let offset = 0;
  function number() {
    let result = 0;
    let shift = 0;
    let byte;
    do {
      byte = bytes[offset++];
      result |= (byte & 127) << shift;
      shift += 7;
    } while (byte & 128);
    return result >>> 0;
  }
  const signed = () => { const n = number(); return (n >>> 1) ^ -(n & 1); };
  function coordinates(withDistance) {
    const count = number();
    const points = [];
    let x = 0, y = 0, m = 0;
    for (let i = 0; i < count; i++) {
      y += signed();
      x += signed();
      points.push([y / 1e7, x / 1e7]);
      if (withDistance) { m += number(); meters.push(m / 100); }
    }
    return points;
  }
  meters = [];
  route = coordinates(true);
  nodes = coordinates(false);
}
const backendUrl = window.ROAD_TO_COMPOSTELLA_BACKEND_URL || '';
const backendConfigured = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(backendUrl);

async function api(action, fields = {}) {
  if (!backendConfigured) throw new Error('The game owner needs to connect the backend.');
  let response;
  try {
    const result = await fetch(backendUrl, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=UTF-8'},
      body: JSON.stringify({action, token, ...fields}),
      credentials: 'omit'
    });
    if (!result.ok) throw new Error('HTTP ' + result.status);
    response = await result.json();
  } catch {
    throw new Error('Could not reach the game server. Try again in a moment.');
  }
  if (response?.ok === true) return response.data;
  throw Object.assign(new Error(response?.error?.message || 'The game server returned an unexpected response.'), {
    code: response?.error?.code
  });
}
function setToken(value) {
  token = value;
  try {
    if (value) sessionStorage.setItem(sessionKey, value);
    else sessionStorage.removeItem(sessionKey);
  } catch {}
}
function showPage(page) {
  const isMap = page === 'map';
  $('account').hidden = isMap;
  $('game').hidden = !isMap;
  $('map-tab').hidden = $('account-tab').hidden = !state;
  $('map-tab').setAttribute('aria-current', isMap ? 'page' : 'false');
  $('account-tab').setAttribute('aria-current', isMap ? 'false' : 'page');
  if (isMap && map) map.invalidateSize({pan:false});
}
function signedOut() {
  setToken('');
  state = null;
  needsSync = false;
  $('login').hidden = false;
  $('signed-in').hidden = true;
  $('entry').hidden = true;
  if (map) { map.remove(); map = null; nextMarker = null; }
  showPage('account');
}
function controls() {
  for (const button of document.querySelectorAll('form button, #sync, #logout')) button.disabled = busy;
  $('move').disabled = busy || needsSync || !state?.pointsAvailable || state.nextNodeId === null;
  if (nextMarker) nextMarker.setIcon(nextIcon());
}
async function run(work, pending, complete = '') {
  if (busy) return;
  busy = true;
  $('notice').textContent = pending;
  controls();
  try {
    await work();
    $('notice').textContent = complete;
  } catch (error) {
    if (error.code === 'UNAUTHORIZED') signedOut();
    $('notice').textContent = error?.message || 'Something went wrong. Try again.';
  } finally {
    busy = false;
    controls();
  }
}
function startMap() {
  if (!route) readRoute();
  map = L.map('map', {preferCanvas:true,maxZoom:19}).setView(nodes[state.currentNodeId],localZoom);
  map.on('zoomend', drawPlayers);
  map.on('moveend', updateCenterControl);
  map.attributionControl.addAttribution('<a href="https://www.openstreetmap.org/copyright">OSM contributors</a> · <a href="https://guiarutas.es/caminos/frances/">FEAACS / IGN</a>');
  map.createPane('basemap').style.zIndex = 200;
  try {
    if (window.maplibregl && L.maplibreGL) L.maplibreGL({
      pane:'basemap',interactive:false,style:'https://tiles.openfreemap.org/styles/liberty',
      attribution:'OpenFreeMap · © OpenMapTiles'
    }).addTo(map);
  } catch {}
  L.polyline(route,{color:'#41554a',weight:7,interactive:false}).addTo(map);
  ahead = L.polyline([],{color:'#fff',weight:4,interactive:false}).addTo(map);
  walked = L.polyline([],{color:'#328454',weight:5,interactive:false}).addTo(map);
  playerMarkers = L.layerGroup().addTo(map);
}
function colourFor(id) {
  let hash = 0;
  for (const char of String(id)) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
  return colours[1 + hash % (colours.length - 1)];
}
function drawPlayers() {
  playerMarkers.clearLayers();
  const groups = new Map();
  const players = [{...state.player,currentNodeId:state.currentNodeId,you:true}, ...state.friends];
  players.forEach(player => {
    const node = player.currentNodeId;
    if (!nodes[node]) return;
    if (!groups.has(node)) groups.set(node,[]);
    groups.get(node).push(player);
  });
  for (const [node,group] of groups) {
    if (group.length > 1 && map.getZoom() < namedZoom) {
      const label = document.createElement('span');
      label.textContent = group.length + ' walkers';
      const names = document.createElement('div');
      group.forEach(player => {
        const name = document.createElement('div');
        name.textContent = player.displayName;
        names.append(name);
      });
      L.marker(nodes[node], {title:label.textContent, icon:L.divIcon({
        className:'walker-group',html:label,iconSize:[80,28],iconAnchor:[40,28]
      })}).bindPopup(names).addTo(playerMarkers);
      continue;
    }
    group.forEach((player,index) => {
      const icon = document.createElement('div');
      const name = document.createElement('span');
      const body = document.createElement('span');
      icon.className = player.you ? 'meeple you' : 'meeple';
      icon.style.setProperty('--offset', (index - (group.length - 1) / 2) * 62 + 'px');
      icon.style.setProperty('--player',player.you ? colours[0] : colourFor(player.id));
      name.className = 'meeple-name';
      name.textContent = player.displayName;
      body.className = 'meeple-body';
      body.textContent = '🚶';
      icon.append(name,body);
      L.marker(nodes[node],{interactive:false,keyboard:false,icon:L.divIcon({
        className:'player-icon',html:icon,iconSize:[1,1],iconAnchor:[0,0]
      })}).addTo(playerMarkers);
    });
  }
}
function updateCenterControl() {
  const target = nodes[state.currentNodeId];
  const center = map.getCenter();
  const zoom = map.getZoom();
  const close = map.latLngToContainerPoint(target).distanceTo(map.latLngToContainerPoint(center)) < 8;
  $('center').hidden = close && zoom === localZoom;
}
function nextIcon() {
  const enabled = !busy && !needsSync && state.pointsAvailable > 0;
  return L.divIcon({className:'next-icon' + (enabled ? '' : ' locked'),iconSize:[26,26],iconAnchor:[13,13]});
}
function applyState(next, animateMove = false) {
  if (!nodes) readRoute();
  if (!nodes[next.currentNodeId] || next.lastNodeId !== nodes.length - 1) {
    throw new Error('The map and backend use different route versions.');
  }
  const positionChanged = state?.currentNodeId !== next.currentNodeId;
  state = next;
  $('login').hidden = true;
  $('signed-in').hidden = false;
  $('identity').textContent = 'Signed in as ' + state.player.displayName;
  $('summary').textContent = state.pointsAvailable.toLocaleString() + ' movement points · Node ' + state.currentNodeId.toLocaleString();
  $('manual').hidden = !state.player.allowEntryOfSteps;
  if (!state.player.allowEntryOfSteps) $('entry').hidden = true;
  $('steps').elements.date.max = state.today;
  if (!$('steps').elements.date.value) $('steps').elements.date.value = state.today;
  const current = nodes[state.currentNodeId];
  $('street').href = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + current.join(',');
  showPage('map');
  if (!map) startMap();
  if (positionChanged) {
    const distance = state.nextNodeId === null ? meters[meters.length - 1] : state.currentNodeId * 100;
    let low = 0, high = meters.length;
    while (low < high) {
      const mid = (low + high) >>> 1;
      if (meters[mid] <= distance) low = mid + 1;
      else high = mid;
    }
    walked.setLatLngs([...route.slice(0,low),current]);
    ahead.setLatLngs([current,...route.slice(low)]);
    if (animateMove) map.panTo(current,{animate:true,duration:0.2});
    else map.setView(current,map.getZoom(),{animate:false});
  }
  updateCenterControl();
  drawPlayers();
  if (nextMarker) { nextMarker.remove(); nextMarker = null; }
  if (nodes[state.nextNodeId]) nextMarker = L.marker(nodes[state.nextNodeId], {
    icon:nextIcon(),title:'Move one node'
  }).on('click',move).addTo(map);
}
function move() {
  if (busy || needsSync || !state?.pointsAvailable || state.nextNodeId === null) return;
  const previous = state;
  const destination = previous.nextNodeId;
  run(async () => {
    const started = performance.now();
    const save = api('move',{fromNodeId:previous.currentNodeId});
    try {
      applyState({
        ...previous,
        currentNodeId:destination,
        nextNodeId:destination < previous.lastNodeId ? destination + 1 : null,
        pointsAvailable:previous.pointsAvailable - 1
      }, true);
    } finally {
      try {
        applyState(await save);
      } catch (error) {
        if (error.code === 'UNAUTHORIZED') throw error;
        try {
          applyState(await api('state'));
          if (state.currentNodeId !== previous.currentNodeId) return;
        } catch (refreshError) {
          if (refreshError.code === 'UNAUTHORIZED') throw refreshError;
          needsSync = true;
          applyState(previous);
          throw new Error('Could not confirm the move. Tap Sync before moving again.');
        }
        throw error;
      } finally {
        console.debug('Move confirmation flow took ' + Math.round(performance.now() - started) + ' ms');
      }
    }
  },'Saving your move…');
}
$('login').onsubmit = event => {
  event.preventDefault();
  const form = event.currentTarget;
  run(async () => {
    const login = await api('login',{username:form.elements.username.value,password:form.elements.password.value});
    setToken(login.token);
    form.reset();
    applyState(await api('state'));
  },'Signing in…');
};
$('logout').onclick = () => run(async () => { await api('logout'); signedOut(); },'Signing out…');
$('sync').onclick = () => run(async () => { applyState(await api('state')); needsSync = false; },'Syncing…','Game synced.');
$('move').onclick = move;
$('manual').onclick = () => { $('entry').hidden = !$('entry').hidden; };
$('steps').onsubmit = event => {
  event.preventDefault();
  const f = event.currentTarget;
  run(async () => {
    applyState(await api('enterSteps',{date:f.elements.date.value,steps:Number(f.elements.steps.value)}));
    f.elements.steps.value = '';
    $('entry').hidden = true;
  },'Saving steps…','Steps saved.');
};
$('map-tab').onclick = () => showPage('map');
$('account-tab').onclick = () => showPage('account');
$('center').onclick = () => map.setView(nodes[state.currentNodeId],localZoom);
if (!backendConfigured) {
  $('login').hidden = true;
  $('notice').textContent = 'The game owner needs to connect the backend.';
} else if (token) run(async () => applyState(await api('state')),'Loading your game…');
</script>
</body>
</html>
